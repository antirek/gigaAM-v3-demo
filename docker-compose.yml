services:
  gigaam:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GIGAAM_CACHE: /data/gigaam
      DIAR_EMB_MODEL: /data/diar/embedding.onnx
      DIAR_SEG_MODEL: /data/diar/segmentation.onnx
      DIAR_DIART_CACHE: /data/diart
      HF_HOME: /data/diart
      HUGGINGFACE_HUB_CACHE: /data/diart/hub
    volumes:
      - ./data/gigaam:/data/gigaam
      - ./data/diar:/data/diar
      - ./data/diart:/data/diart
    deploy:
      resources:
        limits:
          memory: 6G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
