services:
  gigaam:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      GIGAAM_CACHE: /data/gigaam
    volumes:
      - ./data/gigaam:/data/gigaam
    deploy:
      resources:
        limits:
          memory: 6G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
